name: Generate terraform docs

on:
  pull_request:

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository and render docs
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Render terraform docs and fail on diff
      uses: chainguard-actions/terraform-docs-gh-actions@e003d95a56dfe919cab517d5273c2844920369b1 # v1.4.1
      with:
        working-dir: .
        output-file: README.md
        output-method: inject
        fail-on-diff: "true"
    - name: Dump README
      if: failure()
      run: |
        cat README.md
